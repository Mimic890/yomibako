name: Release

# Publishes the Yomibako image to GHCR:
#   push to main  -> ghcr.io/mimic890/yomibako:latest, :sha-<commit>, :main
#   tag v1.2.3    -> :1.2.3, :1.2, :sha-<commit>
# The package must be public for `docker compose up -d` to pull it anonymously
# (GitHub -> Packages -> yomibako -> Package settings -> Change visibility).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: proxy-go/go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...

  publish:
    name: Publish ghcr.io/mimic890/yomibako
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mimic890/yomibako
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Yomibako
            org.opencontainers.image.description=Runtime proxy that exposes Mihon and LNReader sources to BookOrbit
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: proxy-go
          # Matches the upstream miwayomi images (amd64 servers and arm64 boxes).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
