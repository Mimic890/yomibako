name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (proxy-go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: proxy-go/go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go test
        run: go test ./...
      - name: go build
        run: go build -o yomibako .

  node:
    name: Node selfcheck (legacy proxy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node proxy/selfcheck.mjs

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Interpolation uses .env, which is not committed.
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - name: Services are the expected ones
        run: |
          services="$(docker compose config --services | sort | tr '\n' ' ')"
          echo "$services"
          test "$services" = "miwayomi yomibako "

  image:
    name: Docker image (proxy-go)
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: proxy-go
          push: false
          tags: yomibako:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
