# Скопировать в yomibako.yml и поправить под себя. Все поля необязательны.
api_base: https://api.cdnlibs.org/api
site_base: https://ranobelib.me
site_id: 3

# Пауза между запросами к сайту. Меньше 600ms не стоит: API отвечает 429.
request_interval: 600ms

# Куда складывать готовые тома.
output_dir: out

# debug, info, warn, error
log_level: info

# Папка библиотеки BookOrbit, только для чтения: нужна команде sync.
library_dir: ""

# Файл базы: что скачано, подписки, время проверок.
database: yomibako.db

# Папка book-dock BookOrbit. Если задана, тома кладутся сразу туда и BookOrbit
# импортирует их сам; output_dir тогда не используется.
book_dock: ""

# Встраивать иллюстрации глав.
include_images: true

# Авторизация нужна только для платных и части 18+ тайтлов.
# Один файл cookies.txt (формат Netscape) на все источники сразу: сервис берёт из него
# куки для своего домена и сам разбирается с токенами внутри них.
auth:
  cookies_file: ""
  # Токен RanobeLib, если куки не завелись. Можно не трогать и выдать его боту: /token <токен>
  token: ""

# Бот: токен от @BotFather и chat_id владельца. Бот отвечает только этому чату.
telegram:
  token: ""
  chat_id: 0
